<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Círculos</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<div class="panel-izq">
  <div class="rect" style="top: 20px; left: 20px;"></div>
  <div class="rect" style="top: 80px; left: 20px;"></div>
  <div class="rect" style="top: 140px; left: 20px;"></div>
  <div class="rect" style="top: 200px; left: 20px;"></div>
  <div class="rect" style="top: 260px; left: 20px;"></div>
</div>

<div class="editor" id="editor">
  <div class="image-box" style="top: 20px; left: 50px;">
    <img src="mascota.png" alt="Imagen 1">
  </div>
  <div class="image-box" style="top: 100px; left: 200px;">
    <img src="mascota.png" alt="Imagen 1">
  </div>
  <div class="image-box" style="top: 180px; left: 300px;">
    <img src="mascota.png" alt="Imagen 1">
  </div>
  <div class="image-box" style="top: 260px; left: 150px;">
    <img src="mascota.png" alt="Imagen 1">
  </div>
  <div class="image-box" style="top: 350px; left: 80px;">
    <img src="mascota.png" alt="Imagen 1">
  </div>
</div>

<div class="panel-der" id="panel-der">
  <div class="rect" style="top: 20px; right: 20px;"></div>
  <div class="rect" style="top: 80px; right: 20px;"></div>
  <div class="rect" style="top: 140px; right: 20px;"></div>
  <div class="rect" style="top: 200px; right: 20px;"></div>
  <div class="rect" style="top: 260px; right: 20px;"></div>
</div>
<script src="script.js"></script>
</body>
</html>
